# Demo profile: the whole product, talking to a synthetic organisation.
#
#   docker compose up --build      →  http://localhost:3000
#
# No Anthropic credentials are involved. `mock-api` generates a deterministic
# 250-person org from seed 42 and serves the Spend Limits and Analytics surfaces;
# the web app talks to it exactly as it would talk to api.anthropic.com. Writes
# are real writes — against the mock's in-memory state, which resets when the
# container does.
#
# For a real organisation see docker-compose.prod.yml, which drops this service
# entirely rather than pointing it somewhere else.

services:
  mock-api:
    build:
      context: .
      dockerfile: Dockerfile.mock
    environment:
      PORT: "8787"
      MOCK_SEED: "42"
      MOCK_ADMIN_KEY: mock-admin-key
      MOCK_ANALYTICS_KEY: mock-analytics-key
      # `off` | a number of requests per minute. The real API allows 60/min per
      # org across every endpoint; set a number here to rehearse hitting it.
      MOCK_RATE_LIMIT: "off"
    ports:
      - "8787:8787"
    healthcheck:
      # The mock emulates api.anthropic.com, which has no health endpoint, so
      # this checks only that something is listening and answering HTTP — a 404
      # from the mock's own error handler counts.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      mock-api:
        condition: service_healthy
    environment:
      # Container-to-container, so this is the compose service name — not
      # localhost, which inside the web container is the web container.
      ANTHROPIC_BASE_URL: http://mock-api:8787
      ANTHROPIC_ADMIN_KEY: mock-admin-key
      ANTHROPIC_ANALYTICS_KEY: mock-analytics-key
      # Dev auth: pick a persona from the switcher in the sidebar. There is no
      # password on this — whoever reaches it is whoever they select. That is
      # fine here, and on the hosted sandbox, because the only organisation
      # behind it is the mock's. It is never fine with a real Admin key, which
      # is why docker-compose.prod.yml sets AUTH_MODE=proxy instead.
      AUTH_MODE: dev
      AUTH_HEADER: x-forwarded-email
      DATABASE_PATH: /data/app.db
    ports:
      - "3000:3000"
    volumes:
      - bsl-data:/data
    # Overrides the image CMD to add the synthetic employee roster. `db:seed`
    # replaces the employees table on every start, which is what you want from a
    # demo and exactly what you do not want in production.
    command: >
      sh -c "npm run db:migrate && npm run db:seed && npm run start -w apps/web"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

volumes:
  bsl-data:
